[package]
name = "vkms-service"
description = "The Virtual KM Switch service: LocalSystem, session 0. Hosts the mesh and pairing, routes input, supervises the agents, serves the control pipe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vkms-service"
path = "src/main.rs"

[dependencies]
vkms-core.workspace = true
vkms-win.workspace = true
vkms-ipc.workspace = true
vkms-net.workspace = true
windows-sys.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util.workspace = true
windows-service.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
